[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumutilsruntime"
version = "0.1.0a1"
description = "Portable language-runtime adaptation helpers for SUM exports and standalone host runtimes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "plotnine>=0.13"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumutilsruntime*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
